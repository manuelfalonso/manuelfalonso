  assemblies:
  - SombraStudios.Shared.Extensions
  namespace: SombraStudios.Shared.Extensions
  summary: Reveals a <xref href="UnityEngine.GameObject" data-throw-if-not-resolved="false"></xref> previously hidden by <xref href="SombraStudios.Shared.Extensions.GameObjectExtensions.HideInHierarchy(UnityEngine.GameObject)" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    Clears only <xref href="UnityEngine.HideFlags.HideInHierarchy" data-throw-if-not-resolved="false"></xref> and leaves every other flag intact. Does

    nothing if <code class="paramref">gameObject</code> is null.
  example: []
  syntax:
    content: public static void ShowInHierarchy(this GameObject gameObject)
    parameters:
    - id: gameObject
      type: UnityEngine.GameObject
      description: The <xref href="UnityEngine.GameObject" data-throw-if-not-resolved="false"></xref> to reveal.
    content.vb: Public Shared Sub ShowInHierarchy(gameObject As GameObject)
  overload: SombraStudios.Shared.Extensions.GameObjectExtensions.ShowInHierarchy*
