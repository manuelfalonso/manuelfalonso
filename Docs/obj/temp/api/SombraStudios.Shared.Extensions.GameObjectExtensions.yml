  assemblies:
  - SombraStudios.Shared.Extensions
  namespace: SombraStudios.Shared.Extensions
  summary: Hides the specified <xref href="UnityEngine.GameObject" data-throw-if-not-resolved="false"></xref> from the Unity Hierarchy view.
  remarks: >-
    Adds <xref href="UnityEngine.HideFlags.HideInHierarchy" data-throw-if-not-resolved="false"></xref> to <xref href="UnityEngine.Object.hideFlags" data-throw-if-not-resolved="false"></xref> without disturbing

    any other flag the object already carries, such as <xref href="UnityEngine.HideFlags.DontSave" data-throw-if-not-resolved="false"></xref>. The object

    remains active in the scene and can still be accessed programmatically. Does nothing if

    <code class="paramref">gameObject</code> is null.
  example: []
  syntax:
    content: public static void HideInHierarchy(this GameObject gameObject)
    parameters:
    - id: gameObject
      type: UnityEngine.GameObject
      description: The <xref href="UnityEngine.GameObject" data-throw-if-not-resolved="false"></xref> to hide.
    content.vb: Public Shared Sub HideInHierarchy(gameObject As GameObject)
  overload: SombraStudios.Shared.Extensions.GameObjectExtensions.HideInHierarchy*
