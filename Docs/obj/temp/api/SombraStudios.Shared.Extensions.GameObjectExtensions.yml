  assemblies:
  - SombraStudios.Shared.Extensions
  namespace: SombraStudios.Shared.Extensions
  summary: >-
    Retrieves a component of the specified type from the given <xref href="UnityEngine.GameObject" data-throw-if-not-resolved="false"></xref>.  If the component does

    not exist, it is added to the <xref href="UnityEngine.GameObject" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: 'public static T GetOrAdd<T>(this GameObject gameObject) where T : Component'
    parameters:
    - id: gameObject
      type: UnityEngine.GameObject
      description: The <xref href="UnityEngine.GameObject" data-throw-if-not-resolved="false"></xref> to retrieve the component from or add the component to.
    typeParameters:
    - id: T
      description: The type of the component to retrieve or add. Must derive from <xref href="UnityEngine.Component" data-throw-if-not-resolved="false"></xref>.
    return:
      type: '{T}'
      description: >-
        The existing component of type <code class="typeparamref">T</code> if found; otherwise, a newly added component of type
            <code class="typeparamref">T</code>.
    content.vb: Public Shared Function GetOrAdd(Of T As Component)(gameObject As GameObject) As T
  overload: SombraStudios.Shared.Extensions.GameObjectExtensions.GetOrAdd*
  nameWithType.vb: GameObjectExtensions.GetOrAdd(Of T)(GameObject)
  fullName.vb: SombraStudios.Shared.Extensions.GameObjectExtensions.GetOrAdd(Of T)(UnityEngine.GameObject)
