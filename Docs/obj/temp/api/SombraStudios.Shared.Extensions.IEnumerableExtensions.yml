  assemblies:
  - SombraStudios.Shared.Extensions
  namespace: SombraStudios.Shared.Extensions
  summary: Retrieves a specified number of unique random items from the given collection.
  remarks: >-
    Draws from <xref href="UnityEngine.Random" data-throw-if-not-resolved="false"></xref>, so the selection is reproducible via

    <xref href="UnityEngine.Random.InitState(System.Int32)" data-throw-if-not-resolved="false"></xref> and must be called from the main thread.
  example: []
  syntax:
    content: public static IEnumerable<T> GetUniqueRandomItems<T>(this IEnumerable<T> items, int count)
    parameters:
    - id: items
      type: System.Collections.Generic.IEnumerable{{T}}
      description: The source collection to retrieve items from.
    - id: count
      type: System.Int32
      description: The number of unique random items to retrieve.
    typeParameters:
    - id: T
      description: The type of elements in the collection.
    return:
      type: System.Collections.Generic.IEnumerable{{T}}
      description: An <xref href="System.Collections.Generic.IEnumerable%601" data-throw-if-not-resolved="false"></xref> containing the unique random items.
    content.vb: Public Shared Function GetUniqueRandomItems(Of T)(items As IEnumerable(Of T), count As Integer) As IEnumerable(Of T)
  overload: SombraStudios.Shared.Extensions.IEnumerableExtensions.GetUniqueRandomItems*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: Thrown if <code class="paramref">count</code> is less than or equal to 0.
