  assemblies:
  - SombraStudios.Shared.Extensions
  namespace: SombraStudios.Shared.Extensions
  summary: Finds the closest <code class="typeparamref">T</code> object to a specified position.
  example: []
  syntax:
    content: 'public static T GetClosest<T>(this IEnumerable<T> items, Vector3 position) where T : MonoBehaviour'
    parameters:
    - id: items
      type: System.Collections.Generic.IEnumerable{{T}}
      description: The source collection to search.
    - id: position
      type: UnityEngine.Vector3
      description: The position to compare distances against.
    typeParameters:
    - id: T
      description: The type of elements in the collection, which must inherit from <xref href="UnityEngine.MonoBehaviour" data-throw-if-not-resolved="false"></xref>.
    return:
      type: '{T}'
      description: The closest <code class="typeparamref">T</code> object to the specified position, or <code>null</code> if the collection is empty.
    content.vb: Public Shared Function GetClosest(Of T As MonoBehaviour)(items As IEnumerable(Of T), position As Vector3) As T
