  namespace: SombraStudios.Shared.ScriptableObjects.Conditions
  summary: Represents a composite condition that evaluates to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> if all contained conditions are valid.
  remarks: >-
    This condition checks a list of other conditions and returns <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> only if
        all of them are valid. If the list contains a reference to itself, a warning is logged, and the self-reference
        is ignored during evaluation.
  example: []
  syntax:
    content: >-
      [CreateAssetMenu(fileName = "NewAndCondition", menuName = "Sombra Studios/Conditions/And Condition")]

      public class AndConditionSO : ConditionSO, ICondition<VoidStruct>
