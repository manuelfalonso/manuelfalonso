  namespace: SombraStudios.Shared.Extensions
  summary: Returns the object itself if it exists, null otherwise.
  remarks: >-
    This method helps differentiate between a null reference and a destroyed Unity object. Unity's "== null" check

    can incorrectly return true for destroyed objects, leading to misleading behaviour. The OrNull method use

    Unity's "null check", and if the object has been marked for destruction, it ensures an actual null reference is returned,

    aiding in correctly chaining operations and preventing NullReferenceExceptions.
  example: []
  syntax:
    content: 'public static T OrNull<T>(this T obj) where T : Object'
    parameters:
    - id: obj
      type: '{T}'
      description: The object being checked.
    typeParameters:
    - id: T
      description: The type of the object.
    return:
      type: '{T}'
      description: The object itself if it exists and not destroyed, null otherwise.
    content.vb: Public Shared Function OrNull(Of T As [Object])(obj As T) As T
