    This can replace using singleton instances (which tend to make testing more difficult).
  example: []
  syntax:
    content: >-
      [CreateAssetMenu(fileName = "NewGameObjectRuntimeSet", menuName = "Sombra Studios/Runtime Sets/GameObject Runtime Set")]

