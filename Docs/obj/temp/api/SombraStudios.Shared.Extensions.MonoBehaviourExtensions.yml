  assemblies:
  - SombraStudios.Shared.Extensions
  namespace: SombraStudios.Shared.Extensions
  summary: >-
    Ensures a component reference is assigned, falling back to a lookup on the source's own

    <xref href="UnityEngine.GameObject" data-throw-if-not-resolved="false"></xref> when the field is still null.
  remarks: >-
    An already-assigned reference is left untouched, so a value wired up in the Inspector always

    wins over the lookup. Logs an error when neither source provides the component, since the

    common case is a caller that cannot continue without it.
  example: []
  syntax:
    content: 'public static bool EnsureComponent<T>(this MonoBehaviour source, ref T component) where T : Component'
    parameters:
    - id: source
      type: UnityEngine.MonoBehaviour
      description: The behaviour whose <xref href="UnityEngine.GameObject" data-throw-if-not-resolved="false"></xref> is searched.
    - id: component
      type: '{T}'
      description: The field to fill in; respected if it is already assigned.
    typeParameters:
    - id: T
      description: The component type to resolve.
    return:
      type: System.Boolean
      description: True if <code class="paramref">component</code> is assigned once the call returns; otherwise, false.
    content.vb: Public Shared Function EnsureComponent(Of T As Component)(source As MonoBehaviour, component As T) As Boolean
