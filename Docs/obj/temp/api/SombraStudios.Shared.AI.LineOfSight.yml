  assemblies:
  - SombraStudios.Shared.AI
  namespace: SombraStudios.Shared.AI
  summary: Checks if a position is within a field of view, given the observer's position and facing.
  remarks: >-
    The vector form of the check: no Transforms, no scene, no physics, so it can be exercised

    directly. The Transform overload delegates here after resolving which axis is forward.


    <p>

    Degenerate inputs report true, because <xref href="UnityEngine.Vector3.Angle(UnityEngine.Vector3%2cUnityEngine.Vector3)" data-throw-if-not-resolved="false"></xref> returns 0 when either

    vector has no length: a zero <code class="paramref">forward</code>, or a

    <code class="paramref">targetPosition</code> equal to <code class="paramref">origin</code>. Pass a real facing

    direction; it does not need to be normalized.

    </p>
  example: []
  syntax:
    content: public static bool IsInFieldOfView(Vector3 origin, Vector3 forward, Vector3 targetPosition, float viewAngle)
    parameters:
    - id: origin
      type: UnityEngine.Vector3
      description: The observer's position.
    - id: forward
      type: UnityEngine.Vector3
      description: The direction the observer is facing. Need not be normalized.
    - id: targetPosition
      type: UnityEngine.Vector3
      description: The position being tested.
    - id: viewAngle
      type: System.Single
      description: >-
        The full field of view angle, in degrees; the check uses half of it
            either side of <code class="paramref">forward</code>.
    return:
      type: System.Boolean
      description: Returns true if the position is within the field of view, otherwise false.
    content.vb: Public Shared Function IsInFieldOfView(origin As Vector3, forward As Vector3, targetPosition As Vector3, viewAngle As Single) As Boolean
  overload: SombraStudios.Shared.AI.LineOfSight.IsInFieldOfView*
  nameWithType.vb: LineOfSight.IsInFieldOfView(Vector3, Vector3, Vector3, Single)
  fullName.vb: SombraStudios.Shared.AI.LineOfSight.IsInFieldOfView(UnityEngine.Vector3, UnityEngine.Vector3, UnityEngine.Vector3, Single)
  name.vb: IsInFieldOfView(Vector3, Vector3, Vector3, Single)
