  namespace: SombraStudios.Shared.Utility.ReferenceBinder
  summary: Attempts to get all references of a specific type.
  example: []
  syntax:
    content: 'public bool TryGetReferences<T>(out List<T> references) where T : Component'
    parameters:
    - id: references
      type: System.Collections.Generic.List{{T}}
      description: List of components of the specified type if found, null otherwise.
    typeParameters:
    - id: T
      description: The type of component to search for.
    return:
      type: System.Boolean
      description: True if components of the specified type were found, false otherwise.
