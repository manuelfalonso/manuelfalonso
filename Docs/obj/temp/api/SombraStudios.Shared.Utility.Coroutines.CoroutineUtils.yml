  summary: >-
    Retrieves a cached <xref href="UnityEngine.WaitForSeconds" data-throw-if-not-resolved="false"></xref> instance for the specified duration, or creates a new one if

    not already cached.
  example: []
  syntax:
    content: public static WaitForSeconds GetWaitForSeconds(float seconds)
    parameters:
    - id: seconds
      type: System.Single
      description: The duration, in seconds, to wait. Must be a non-negative value.
    return:
      type: UnityEngine.WaitForSeconds
      description: >-
        A <xref href="UnityEngine.WaitForSeconds" data-throw-if-not-resolved="false"></xref> instance representing the specified duration. If the duration is already
            cached, the cached instance is returned; otherwise, a new instance is created and cached.
    content.vb: Public Shared Function GetWaitForSeconds(seconds As Single) As WaitForSeconds
