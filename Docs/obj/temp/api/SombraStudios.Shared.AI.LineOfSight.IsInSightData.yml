  assemblies:
  - SombraStudios.Shared.AI
  namespace: SombraStudios.Shared.AI
  summary: Represents the data for a sight check.
  remarks: >-
    The observer, the target and the obstacle mask are constructor arguments because a check

    without them cannot do anything; everything else is optional. Being a

    <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/readonly">readonly</a> struct means an instance cannot be half-built or mutated after

    the fact, and lets callers pass it by <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/in">in</a> without a defensive copy.
  example: []
  syntax:
    content: public readonly struct LineOfSight.IsInSightData
