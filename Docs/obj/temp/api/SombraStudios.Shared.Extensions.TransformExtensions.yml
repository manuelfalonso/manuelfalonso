  assemblies:
  - SombraStudios.Shared.Extensions
  namespace: SombraStudios.Shared.Extensions
  summary: Resets the transform's local position, rotation and scale to their identity values.
  remarks: >-
    Operates entirely in local space, so a child returns to its parent's origin rather than the

    world origin.
  example: []
  syntax:
    content: public static void ResetTransform(this Transform trans)
    parameters:
    - id: trans
      type: UnityEngine.Transform
      description: The transform to reset.
    content.vb: Public Shared Sub ResetTransform(trans As Transform)
