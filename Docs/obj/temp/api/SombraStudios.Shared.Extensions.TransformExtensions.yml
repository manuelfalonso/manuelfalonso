  assemblies:
  - SombraStudios.Shared.Extensions
  namespace: SombraStudios.Shared.Extensions
  summary: Rotates the transform so that the given local direction points along a world-space vector.
  remarks: >-
    This assigns <xref href="UnityEngine.Transform.up" data-throw-if-not-resolved="false"></xref>, <xref href="UnityEngine.Transform.right" data-throw-if-not-resolved="false"></xref> or

    <xref href="UnityEngine.Transform.forward" data-throw-if-not-resolved="false"></xref>, so it changes the transform's rotation, not its position.

    Aiming a single axis leaves the roll around that axis unspecified - Unity picks one. Use

    <xref href="UnityEngine.Quaternion.LookRotation(UnityEngine.Vector3%2cUnityEngine.Vector3)" data-throw-if-not-resolved="false"></xref> when the roll matters.
  example: []
  syntax:
    content: public static void SetDirection(this Transform trans, Direction direction, Vector3 value)
    parameters:
    - id: trans
      type: UnityEngine.Transform
      description: The transform to rotate.
    - id: direction
      type: SombraStudios.Shared.Extensions.Direction
      description: Which of the transform's local directions to aim.
    - id: value
      type: UnityEngine.Vector3
      description: The world-space vector to aim that direction along.
    content.vb: Public Shared Sub SetDirection(trans As Transform, direction As Direction, value As Vector3)
  overload: SombraStudios.Shared.Extensions.TransformExtensions.SetDirection*
