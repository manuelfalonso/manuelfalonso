  assemblies:
  - SombraStudios.Shared.Physics
  namespace: SombraStudios.Shared.Physics.Events
  summary: Forces the system to re-evaluate whether the specified collider has exited a trigger zone.
  remarks: >-
    This method is typically used to manually enforce trigger exit checks in scenarios
        where  automatic detection may not occur as expected. Ensure that the provided collider is valid  and
        associated with the relevant trigger zone.
  example: []
  syntax:
    content: public override void ForceTriggerExitColliderCheck(Collider2D collider)
    parameters:
    - id: collider
      type: UnityEngine.Collider2D
      description: The collider to check for trigger exit conditions. Cannot be null.
