  assemblies:
  - SombraStudios.Shared.Physics
  namespace: SombraStudios.Shared.Physics.Events
  summary: Forces a trigger event to be processed for the specified collider.
  remarks: >-
    This method is intended to manually invoke a trigger event for the given collider, 
        typically in scenarios where automatic trigger detection is insufficient or bypassed.
  example: []
  syntax:
    content: public override void ForceTriggerEnterColliderCheck(Collider2D collider)
    parameters:
    - id: collider
      type: UnityEngine.Collider2D
      description: The collider for which the trigger event should be processed. Cannot be null.
    content.vb: Public Overrides Sub ForceTriggerEnterColliderCheck(collider As Collider2D)
