  assemblies:
  - SombraStudios.Shared.Utility
  namespace: SombraStudios.Shared.Utility.UnityGizmos
  summary: 'Draws a field of view cone: two boundary lines and the arc that closes them.'
  remarks: >-
    Built from <xref href="UnityEngine.Gizmos" data-throw-if-not-resolved="false"></xref> line segments rather than <code>Handles.DrawSolidArc</code>, because

    <code>Handles</code> lives in <code>UnityEditor</code> and would drag an Editor-only dependency into a

    runtime component. <xref href="UnityEngine.Gizmos" data-throw-if-not-resolved="false"></xref> has no arc primitive, hence the segments.


    <p>

    Like every other gizmo utility here, coordinates are local while the base's

    "Is Local Position" option is enabled, since it sets <xref href="UnityEngine.Gizmos.matrix" data-throw-if-not-resolved="false"></xref> to the

    transform's local-to-world matrix before drawing.

    </p>
  example: []
  syntax:
    content: 'public class GizmosFieldOfViewUtility : GizmosUtility'
    content.vb: Public Class GizmosFieldOfViewUtility Inherits GizmosUtility
  inheritance:
